name: Compiler l'APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Extraire le projet (projet.zip)
        run: unzip -q projet.zip -d projet

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        working-directory: projet
        run: gradle assembleDebug --no-daemon --stacktrace > ../build.log 2>&1

      - name: Résumé des erreurs
        if: failure()
        run: |
          {
            echo '## Erreurs de compilation'
            echo '```'
            grep -E -A4 '^e: |What went wrong|Could not resolve|Could not find|error:|Execution failed' build.log | head -60 || true
            echo '--- fin du journal ---'
            tail -25 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: LecteurVocal-apk
          path: projet/app/build/outputs/apk/debug/app-debug.apk
